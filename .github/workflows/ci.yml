name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type & template check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Offline: verifies content/img against its manifest and the content rules. CI never
      # downloads pictures; `npm run content` is run by hand and its output committed.
      - name: Content check
        run: npm run check:content

      # The VITE_* values are public by design (they end up in the bundle). They are
      # repository variables, never secrets. The e2e job sets its own fake client id.
      - name: Build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
        run: npm run build

  e2e:
    name: End-to-end (Chromium & WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is the one real cost of this job, so it is cached per lockfile.
      # The `-browsers-` segment is part of the cache identity: change it whenever the set of
      # installed browsers changes, or a stale cache skips the install and an engine is missing.
      - name: Cache the Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-browsers-chromium-webkit-${{ hashFiles('package-lock.json') }}

      - name: Install the browsers
        run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # A cached browser directory carries no apt packages, so the system libraries WebKit
      # links against have to be installed even on a hit.
      - name: Install the browsers' system dependencies
        run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # `CI` is set by the runner, which turns WebKit on in playwright.config.ts.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
